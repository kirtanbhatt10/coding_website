<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall of Fame - Coding Competition</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="light-mode">
    <nav class="navbar">
        <div class="navbar-brand">
            <img id="navbar-logo" src="/static/logo/default-logo.png" alt="College Logo" class="navbar-logo" onerror="this.style.display='none'">
            <span>Coding Competition</span>
        </div>
        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/admin-login" style="color: var(--primary-color); font-weight: bold;">🔐 Admin</a>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        </div>
    </nav>

    <div class="hall-of-fame-container">
        <div class="leaderboard-header">
            <h1>🏆 Hall of Fame</h1>
            <p>Celebrating our champions</p>
        </div>

        <div class="hall-of-fame-grid" id="hall-of-fame-grid">
            <div style="text-align: center; grid-column: 1 / -1; padding: 40px;">
                <div class="spinner"></div>
                <p>Loading Hall of Fame...</p>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/hall-of-fame.js"></script>
    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.body.classList.remove('light-mode');
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
