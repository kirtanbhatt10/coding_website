<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiting Lobby - Coding Competition</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="light-mode">
    <nav class="navbar">
        <div class="navbar-brand">
            <img id="navbar-logo" src="/static/logo/default-logo.png" alt="College Logo" class="navbar-logo" onerror="this.style.display='none'">
            <span id="event-name">Coding Competition</span>
        </div>
        <div class="navbar-links">
            <a href="/hall-of-fame">Hall of Fame</a>
            <a href="/admin-login" style="color: var(--primary-color); font-weight: bold;">🔐 Admin</a>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        </div>
    </nav>

    <div class="lobby-container">
        <div class="lobby-header">
            <img id="lobby-logo" src="/static/logo/default-logo.png" alt="College Logo" class="lobby-logo" onerror="this.style.display='none'">
            <h1>Waiting Lobby</h1>
            <p>Waiting for the contest to start...</p>
        </div>

        <div class="waiting-message">
            <h2>⏳ Contest Not Started</h2>
            <p>Please wait for the admin to start the competition.</p>
        </div>

        <div>
            <h2 style="margin-bottom: 20px;">Players Joined (<span id="player-count">0</span>)</h2>
            <div class="players-list" id="players-list">
                <!-- Players will be added here dynamically -->
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/lobby.js"></script>
    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.body.classList.remove('light-mode');
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
