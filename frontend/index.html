<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Competition - Register</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="light-mode">
    <nav class="navbar">
        <div class="navbar-brand">
            <img id="navbar-logo" src="/static/logo/default-logo.png" alt="College Logo" class="navbar-logo" onerror="this.style.display='none'">
            <span>Coding Competition</span>
        </div>
        <div class="navbar-links">
            <a href="/hall-of-fame">Hall of Fame</a>
            <a href="/admin-login" style="color: var(--primary-color); font-weight: bold;">🔐 Admin</a>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        </div>
    </nav>

    <div class="landing-hero">
        <img id="hero-logo" src="/static/logo/default-logo.png" alt="College Logo" class="hero-logo" onerror="this.style.display='none'">
        <h1 class="hero-title" id="event-title">Coding Competition</h1>
        <p class="hero-subtitle">Test your Python skills and compete for glory!</p>
        
        <div class="registration-form">
            <h2 style="margin-bottom: 20px;">Join the Competition</h2>
            <form id="registration-form">
                <div class="form-group">
                    <label for="join-code">Event Join Code *</label>
                    <input type="text" id="join-code" name="join_code" required placeholder="Enter 6-digit join code" maxlength="6" style="text-transform: uppercase; letter-spacing: 2px; font-size: 1.2rem; text-align: center; font-weight: bold;">
                    <small style="color: var(--text-light-secondary); font-size: 0.9rem; display: block; margin-top: 5px;">Get the join code from your event organizer</small>
                </div>
                
                <div class="form-group">
                    <label for="player-name">Player Name</label>
                    <input type="text" id="player-name" name="name" required placeholder="Enter your name">
                </div>
                
                <div class="form-group">
                    <label for="college-year">College Year</label>
                    <select id="college-year" name="college_year" required>
                        <option value="">Select Year</option>
                        <option value="1st">1st Year</option>
                        <option value="2nd">2nd Year</option>
                        <option value="3rd">3rd Year</option>
                        <option value="4th">4th Year</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-primary">Join Competition</button>
            </form>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script>
        // Load event details and logo
        async function loadEventDetails() {
            try {
                const response = await fetch('/api/admin/event/active');
                const event = await response.json();
                
                if (event && event.logo_path) {
                    document.getElementById('navbar-logo').src = event.logo_path;
                    document.getElementById('hero-logo').src = event.logo_path;
                    document.getElementById('navbar-logo').style.display = 'block';
                    document.getElementById('hero-logo').style.display = 'block';
                }
                
                if (event && event.name) {
                    document.getElementById('event-title').textContent = event.name;
                }
            } catch (error) {
                console.error('Error loading event details:', error);
            }
        }
        
        loadEventDetails();
        
        // Handle registration
        document.getElementById('registration-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const joinCode = document.getElementById('join-code').value.trim().toUpperCase();
            const formData = {
                name: document.getElementById('player-name').value.trim(),
                college_year: document.getElementById('college-year').value,
                join_code: joinCode
            };
            
            if (!formData.join_code || !formData.name || !formData.college_year) {
                alert('Please fill in all fields including the join code');
                return;
            }
            
            if (formData.join_code.length !== 6) {
                alert('Join code must be 6 characters');
                return;
            }
            
            try {
                // First verify the join code
                const codeCheck = await fetch(`/api/admin/event/by-code/${joinCode}`);
                if (!codeCheck.ok) {
                    const error = await codeCheck.json();
                    alert('Invalid join code: ' + (error.detail || 'Please check the code and try again'));
                    return;
                }
                
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                if (response.ok) {
                    const user = await response.json();
                    localStorage.setItem('session_id', user.session_id);
                    localStorage.setItem('user_name', user.name);
                    window.location.href = '/lobby';
                } else {
                    const error = await response.json();
                    alert('Registration failed: ' + (error.detail || 'Unknown error'));
                }
            } catch (error) {
                alert('Error connecting to server. Please try again.');
                console.error('Registration error:', error);
            }
        });
        
        // Auto-uppercase join code
        document.getElementById('join-code').addEventListener('input', function(e) {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        });
        
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.body.classList.remove('light-mode');
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
