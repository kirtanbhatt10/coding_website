<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - Coding Competition</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="light-mode">
    <nav class="navbar">
        <div class="navbar-brand">
            <img id="navbar-logo" src="/static/logo/default-logo.png" alt="College Logo" class="navbar-logo" onerror="this.style.display='none'">
            <span id="event-name">Coding Competition</span>
        </div>
        <div class="navbar-links">
            <a href="/contest">Contest</a>
            <a href="/hall-of-fame">Hall of Fame</a>
            <a href="/admin-login" style="color: var(--primary-color); font-weight: bold;">🔐 Admin</a>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        </div>
    </nav>

    <div class="leaderboard-container">
        <div class="leaderboard-header">
            <h1>🏆 Live Leaderboard</h1>
            <p>Real-time rankings and scores</p>
        </div>

        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th>College Year</th>
                    <th>Score</th>
                    <th>Questions Solved</th>
                    <th>Total Time</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr>
                    <td colspan="6" style="text-align: center; padding: 40px;">
                        <div class="spinner"></div>
                        <p>Loading leaderboard...</p>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/leaderboard.js"></script>
    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.body.classList.remove('light-mode');
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
