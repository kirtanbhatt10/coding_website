<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contest - Coding Competition</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="light-mode">
    <nav class="navbar">
        <div class="navbar-brand">
            <img id="navbar-logo" src="/static/logo/default-logo.png" alt="College Logo" class="navbar-logo" onerror="this.style.display='none'">
            <span id="event-name">Coding Competition</span>
        </div>
        <div class="navbar-links">
            <a href="/leaderboard">Leaderboard</a>
            <a href="/hall-of-fame">Hall of Fame</a>
            <a href="/admin-login" style="color: var(--primary-color); font-weight: bold;">🔐 Admin</a>
            <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        </div>
    </nav>

    <div class="contest-layout">
        <div class="question-panel">
            <div class="question-header">
                <div class="question-level" id="question-level">Level 1</div>
                <h2 class="question-title" id="question-title">Loading...</h2>
                <div class="timer" id="timer">--:--</div>
            </div>
            
            <div class="question-description" id="question-description">
                Loading question...
            </div>

            <div class="editor-container">
                <textarea id="code-editor" class="code-editor" placeholder="Write your Python code here..."></textarea>
                <div class="editor-buttons">
                    <button class="btn btn-primary btn-run" onclick="runCode()">Run Code</button>
                    <button class="btn btn-success btn-submit" onclick="submitCode()">Submit</button>
                </div>
            </div>

            <div class="output-panel" id="output-panel">
                <div>Output will appear here...</div>
            </div>

            <div class="test-results" id="test-results"></div>
        </div>

        <div class="sidebar">
            <div class="progress-card">
                <h3>Your Progress</h3>
                <div class="progress-item">
                    <div>Level 1: <span id="level1-progress">0/4</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="level1-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="progress-item">
                    <div>Level 2: <span id="level2-progress">0/4</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="level2-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="progress-item">
                    <div>Level 3: <span id="level3-progress">0/4</span></div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="level3-bar" style="width: 0%"></div>
                    </div>
                </div>
                <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-light);">
                    <strong>Score: <span id="user-score">0</span></strong>
                </div>
            </div>

            <div class="leaderboard-mini">
                <h3>Top 5</h3>
                <div id="mini-leaderboard">
                    Loading...
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/contest.js"></script>
    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        }
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.body.classList.remove('light-mode');
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
